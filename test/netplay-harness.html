<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>NET</title>
<script type="importmap">{"imports":{"three":"/vendor/three.module.js","three/addons/":"/addons/"}}</script>
<link rel="stylesheet" href="/src/style.css">
</head>
<body style="background:#0a0e12;color:#dfe4e8;font:13px monospace">
<canvas id="c"></canvas><div id="ui"></div><pre id="out"></pre>
<script type="module">
import * as THREE from 'three';
import { NetGame } from '/src/netplay.js';
import { HUD } from '/src/hud.js';
import { loadMap } from '/server/mapdata.js';

const out = document.getElementById('out');
const say = (s) => { out.textContent += s + '\n'; };
let P = 0, F = 0;
const ok = (c, n, x = '') => { c ? (P++, say('PASS ' + n)) : (F++, say('FAIL ' + n + ' ' + x)); };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const world = loadMap().world;

function stubGame() {
  const g = {
    time: 0, frame: 0, playing: false, paused: false, ended: false, net: null, inLoadout: false,
    actors: [], tags: [], score: { BL: 0, GR: 0 }, goal: 50, timeLeft: 600,
    qs: new URLSearchParams(location.search),
    opts: { sens: 1, fov: 78, vol: 0, primary: 'ak47' },
    renderer: { scene: new THREE.Scene(), camera: new THREE.PerspectiveCamera(78, 1.6, 0.05, 400) },
    world,
    fx: { muzzle() {}, tracer() {}, impact() {}, explosion() {}, light() {}, bloodSplat() {}, shake: 0 },
    vm: { equip() {}, setVisible() {}, fire() {}, melee() {}, reload() {}, throwNade() {}, inspect() {}, setTeam() {}, setBossLook() {} },
    hud: { toast() {}, slots() {}, update() {}, drawRadar() {}, scoreboard() {}, bossBar() {}, bossVeil() {}, killFeed() {}, hitmarker() {}, damageFrom() {}, badge() {}, show() {}, el: { menu: { classList: { add() {}, remove() {}, toggle() {} } } } },
    audio: { playUI() {} },
    aimTarget: null, dmgFlash: 0, killedBy: null,
    lock() {},
    addTag(a) { const sp = { visible: false, position: new THREE.Vector3() }; g.tags.push({ sprite: sp, actor: a }); },
    removeTag(a) { g.tags = g.tags.filter((t) => t.actor !== a); },
    onJump() {}, onLand() {}, onFootstep() {}, onReloadStart() {}, onReloadDone() {}, onScope() {}, onDryFire() {}, onGrenadeStart() {}, onSwitch() {},
    toggleLoadout() {},
  };
  return g;
}

const drv = [];
function drive(ng) {
  const iv = setInterval(() => {
    if (!ng.inMatch) return;
    try { ng.update(1 / 30); } catch (e) { say('ERR update: ' + (e && e.stack || e)); F++; }
  }, 33);
  drv.push(iv);
}

try {
  // ---------- 新武器枪械模型构造（纯几何，无需 WebGL） ----------
  const { buildGun } = await import('/src/guns.js');
  const { WEAPONS, PRIMARIES } = await import('/src/weapons.js');
  for (const id of ['m249', 'm3', 'thompson']) {
    let err = null, g = null;
    try { g = buildGun(id); } catch (e) { err = e; }
    const found = {};
    if (g) g.traverse((o) => { if (!o.isMesh && o.name) found[o.name] = 1; });
    ok(!err && found.muzzle && found.grip && !!WEAPONS[id] && PRIMARIES.includes(id), '新武器模型构建: ' + id, err ? String(err).slice(0, 90) : '');
  }
  // BOSS 专属近战巨爪：模型可建（makeIcons 会遍历到 buildGunMerged）、是近战、不进主武器池、可放进近战槽
  {
    const { buildGunMerged } = await import('/src/guns.js');
    const { makeLoadout } = await import('/src/weaponsim.js');
    let gErr = null, mErr = null, claw = null, mergedClaw = null;
    try { claw = buildGun('bossclaw'); } catch (e) { gErr = e; }
    try { mergedClaw = buildGunMerged('bossclaw'); } catch (e) { mErr = e; }
    const anchors = {}; if (claw) claw.traverse((o) => { if (!o.isMesh && o.name) anchors[o.name] = 1; });
    ok(!gErr && !!claw && anchors.muzzle && anchors.grip, 'BOSS 巨爪第一人称模型可构建', gErr ? String(gErr).slice(0, 90) : '');
    ok(!mErr && !!mergedClaw, 'BOSS 巨爪第三人称合并模型可构建（图标用）', mErr ? String(mErr).slice(0, 90) : '');
    ok(WEAPONS.bossclaw && WEAPONS.bossclaw.type === 'melee' && !PRIMARIES.includes('bossclaw'), '巨爪是近战且不在主武器池');
    const inv = makeLoadout('m249', 7, 'bossclaw');
    ok(inv[2].id === 'bossclaw' && inv[0].id === 'm249', 'makeLoadout 可把近战槽设为巨爪', inv[2].id);
    ok(makeLoadout('ak47', 7)[2].id === 'knife', '默认近战槽仍是军刀');
  }

  // ---------- 角色模型构造（精细化几何 + 手臂 IK） ----------
  const { Soldier } = await import('/src/character.js');
  for (const team of ['BL', 'GR']) {
    let err = null, vcount = 0;
    try {
      const so = new Soldier(team);
      so.setWeapon('ak47');
      const st = { speed: 3.2, fwd: 1, side: 0.3, crouch: false, pitch: 0.1, onGround: true, reloading: false, t: 1 };
      for (let i = 0; i < 5; i++) so.update(0.016, st);
      so.update(0.016, { ...st, crouch: true });
      vcount = so.mesh.geometry.attributes.position.count;
    } catch (e) { err = e; }
    ok(!err && vcount > 400, '士兵模型构建: ' + team, err ? String(err).slice(0, 140) : ('verts=' + vcount));
    // 命中盒 slab 重写正确性：躯干命中 / 脱靶 null
    let hit = null, miss = null;
    try {
      const so2 = new Soldier(team); so2.setWeapon('ak47'); so2.update(0.016, { speed: 0, fwd: 1, crouch: false, pitch: 0, onGround: true });
      so2.root.position.set(0, 0, 0); so2.mesh.updateMatrixWorld(true);
      hit = so2.hitTest(new THREE.Vector3(0, 1.32, 5), new THREE.Vector3(0, 0, -1), 20, 900 + Math.random() * 1000);
      miss = so2.hitTest(new THREE.Vector3(0.95, 1.32, 5), new THREE.Vector3(0, 0, -1), 20, 900 + Math.random() * 1000);
    } catch (e) { err = e; }
    ok(!!hit && ['chest', 'stomach', 'head', 'arm', 'leg'].includes(hit.part) && hit.t > 3 && hit.t < 5.2, '命中盒躯干命中: ' + team, hit ? JSON.stringify(hit) : 'null');
    ok(!miss, '命中盒近身脱靶为 null: ' + team, miss ? JSON.stringify(miss) : '');
  }

  // ---------- PVE 计分板：怪物折叠 + 文案 ----------
  try {
    const gh = stubGame(); const hud = new HUD(gh);
    gh.net = { room: { mode: 'pve', diff: 'normal' } };
    const ent = (id, ex) => Object.assign({ id, name: 'P' + id, team: 'BL', alive: true, stats: { k: 1, d: 1, hs: 0 }, ping: 10 }, ex);
    const mons = [];
    for (let i = 0; i < 20; i++) mons.push(ent(900 + i, { team: 'GR', name: '丧尸' + i, isMonster: true, kind: 'infected', alive: i < 12 }));
    hud.scoreboard(true, [ent(1, {}), ent(2, { isBot: true }), ...mons], 1, { BL: 5, GR: 2 });
    const html = hud.el.boardBody.innerHTML, trs = (html.match(/<tr/g) || []).length;
    ok(/🧟 怪物 ×20（存活 12）/.test(html) && trs <= 6, 'PVE 计分板把 20 只怪折叠成一行', `tr=${trs}`);
    ok(/清怪小队/.test(html) && /怪潮/.test(html), 'PVE 计分板改用清怪小队 / 怪潮标题');
    gh.net = null;
    hud.scoreboard(true, [ent(1, {}), ent(2, { team: 'GR' })], 1, { BL: 1, GR: 0 });
    ok(/潜伏者/.test(hud.el.boardBody.innerHTML) && !/🧟/.test(hud.el.boardBody.innerHTML), 'PVP 计分板文案保持原样');
  } catch (e) { ok(false, 'PVE 计分板', String(e).slice(0, 160)); }

  // ---------- PVE 表现层：补给站 / 空投 / BOSS 血条与事件 ----------
  try {
    const gh2 = stubGame(); const hud2 = new HUD(gh2);
    const gp = stubGame(); gp.hud = hud2;
    const P = new NetGame(gp);
    P.room = { mode: 'pve', diff: 'normal' };
    P.supMask = 0b111111; P.ensureProps();
    ok(!!P.props && P.props.stations.length === 6 && hud2.bossEl.parentNode !== null, 'PVE 补给站按共享坐标建出 6 个模型');
    P.applySup(0b101010);
    ok(P.props.stations.filter((s) => s.ready).length === 3, '就绪位掩码驱动补给站发光');
    P.applySup(0b111111);
    P.syncCrates([[11, 2, 0.55, 3], [12, 4, 0.55, 6]]);
    ok(P.props.crates.size === 2, 'BOSS 空投箱按清单生成');
    P.syncCrates([[11, 2, 0.55, 3]]);
    ok(P.props.crates.size === 1, '空投箱被取走后从场景移除');
    P.onEvent({ e: 'bossin', id: 77, nm: '铁皮暴君', hp: 2400, hpMax: 2400 });
    ok(P.boss && P.boss.id === 77 && P.boss.hpMax === 2400, 'bossin 事件建立 BOSS 血条数据');
    hud2.bossBar(P.boss);
    const bf1 = parseFloat(hud2.bossEl.querySelector('.bf').style.width) || 0;
    ok(/铁皮暴君/.test(hud2.bossEl.textContent) && /2400/.test(hud2.bossEl.textContent) && Math.abs(bf1 - 100) < 0.6, 'BOSS 血条渲染名称与血量', `w=${bf1} txt=${hud2.bossEl.textContent}`);
    P.onEvent({ e: 'hit', a: 1, v: 77, dmg: 30, part: 'chest', hp: 1200, ar: 0, ax: 0, az: 0, k: 0 });
    P.refreshBossBar();
    const bf2 = parseFloat(hud2.bossEl.querySelector('.bf').style.width) || 0;
    ok(P.boss.hp === 1200 && Math.abs(bf2 - 50) < 0.6, 'hit 事件实时更新 BOSS 血条', `w=${bf2}`);
    P.onEvent({ e: 'boss', a: 'blink', id: 77, o: [1, 0, 1], p: [8, 0, 4] });
    P.onEvent({ e: 'boss', a: 'barrage', id: 77, nm: '铁皮暴君' });
    P.onEvent({ e: 'blast', k: 'acid', p: [2, 0.9, 3], r: 4.6 });
    P.onEvent({ e: 'sup', id: 1, i: 0, k: 'ammo', hp: 100, ar: 100 });
    P.onEvent({ e: 'possess', id: 1, name: '张三', k: 'tyran', nm: '铁皮暴君', hpMax: 2400 });
    ok(P.boss && P.boss.by === 1 && P.boss.who === '张三', 'possess 事件切到"玩家附身"血条');
    P.onEvent({ e: 'bossdown', nm: '铁皮暴君', k: 'tyran', a: 1, p: [2, 0.55, 3] });
    ok(P.boss === null, 'bossdown 事件清空血条数据');
    P.dropProps();
    ok(P.props === null, '离开 PVE 对局时销毁补给站与空投网格');
    // 附身管线：名册行改自身阵营 + 血条，换装同步到本地预测
    P.room = { mode: 'pve' }; P.myId = 1;
    P.me = { id: 1, name: '我', team: 'BL', primary: 'ak47', shotSeed: 77, slot: 0, lastSlot: 1, inv: [], stats: { k: 0, d: 0, hs: 0, shots: 0, hits: 0 }, hp: 100, hpMax: 100, ping: 10 };
    P.swapSelfLoadout('m249');
    ok(P.me.primary === 'm249' && P.me.inv[0].id === 'm249' && P.me.slot === 0, '附身换装同步到本地预测武器');
    P.syncRoster([{ id: 1, name: '我', team: 'GR', bot: 0, boss: 2, kind: 'tyran', bnm: '铁皮暴君', hp: 1500, hpMax: 2400, k: 0, d: 0, hs: 0, ping: 10, on: 1 }]);
    ok(P.me.team === 'GR' && P.boss && P.boss.nm === '铁皮暴君' && P.boss.by === 1 && P.boss.who === '我', '名册 boss=2 行切换自身阵营与血条');
    P.refreshBossBar();
    ok(!hud2.bossEl.classList.contains('hidden') && /1500/.test(hud2.bossEl.textContent), '附身状态下自己的血量走 BOSS 血条');
    P.swapSelfLoadout('ak47');
    ok(P.me.inv[0].id === 'ak47', '下甲换回原武器');
  } catch (e) { ok(false, 'PVE 表现层', String(e).slice(0, 180)); }

  // ---------- BOSS / 怪物外观：与人类士兵显著区分 ----------
  try {
    const { LOOKS, bump, emitAmbient } = await import('/src/bosslook.js');
    const { ViewModel } = await import('/src/viewmodel.js');
    const gL = stubGame(); const hudL = new HUD(gL); gL.hud = hudL;
    const L = new NetGame(gL); L.myId = 1;
    L.room = { mode: 'pve', diff: 'normal' }; L.ensureLamp();
    ok(!!L.lamp && L.lamp.isPointLight === true && L.lamp.intensity === 0, 'PVE 开局先备好一盏待命的 BOSS 灯');
    L.me = { id: 1, name: '我', team: 'BL', primary: 'ak47', slot: 0, lastSlot: 1, inv: [], stats: { k: 0, d: 0, hs: 0, shots: 0, hits: 0 }, hp: 100, hpMax: 100, ping: 10 };
    const row = (id, name, extra) => Object.assign({ id, name, team: 'GR', bot: 0, k: 0, d: 0, hs: 0, ping: 0, on: 1 }, extra);
    L.syncRoster([
      row(1, '我', { team: 'BL' }),
      row(9001, '丧尸3', { kind: 'infected' }),
      row(9002, '重装暴徒', { kind: 'heavy' }),
      row(9003, '铁皮暴君', { kind: 'tyran', boss: 1, hp: 2400, hpMax: 2400 }),
    ]);
    const inf = L.remotes.get(9001), hv = L.remotes.get(9002), boss = L.remotes.get(9003);
    ok(inf.soldier.lookKey === 'infected' && inf.soldier.mesh.scale.x !== 1 && inf.soldier.style.hunch > 0.3 && inf.soldier.style.lop < 1, '感染体：换体型 + 弓背跛行步态（人类没有）');
    ok(hv.soldier.extras.length >= 3 && hv.soldier.material.color.getHex() === LOOKS.heavy.tint && hv.soldier.mesh.scale.x > 1.4, '重装暴徒：肩甲 + 锈色皮肤 + 加宽体型');
    ok(boss.soldier.extras.length >= 8 && !!boss.soldier.aura && boss.soldier.hideGun === true && boss.soldier.hitMat === 'metal', '铁皮暴君：轮廓件 + 地面警示环 + 不扛枪');
    boss.soldier.setWeapon('m249');
    ok(boss.soldier.gun && boss.soldier.gun.visible === false, 'BOSS 的枪械网格隐藏（弹道锚点仍在）');
    // —— 卡死回归：BOSS 登场卡的不是填充率，是"每只都新建 4~6 个材质→现编译着色器"（实测登场帧 ~500ms，全客户端同时卡）
    // 修复后材质按 (种类,附身) 池化复用：同种第二次登场必须拿回同一套对象，零新建即零编译。
    // 用独立 Soldier + 空 opts（不挂共享灯），彻底不碰上面 tyran 的灯状态
    const { Soldier: BSoldier } = await import('/src/character.js');
    const { dressSoldier, undressSoldier, prewarmBossFx } = await import('/src/bosslook.js');
    const sa = new BSoldier('GR'); dressSoldier(sa, 'mother', false, {});
    const setA = sa.matSet;
    ok(!!setA && Array.isArray(setA.list) && setA.list.length >= 4, 'BOSS 换装产出一整套可复用材质', `n=${setA && setA.list.length}`);
    ok(!!sa.aura && sa.aura.material.opacity > 0.1 && !!sa.fxRefs.halo && !!sa.fxRefs.beam, '母体自带光环 / 光晕 / 天光柱');
    undressSoldier(sa);                                       // 归还池子（不 dispose）
    const sb = new BSoldier('GR'); dressSoldier(sb, 'mother', false, {});
    ok(sb.matSet === setA, '同种 BOSS 二次登场复用同一套材质（零新建 = 零着色器编译）');
    ok(sb.aura && sb.aura.material.opacity > 0.1 && sb.aura.material.transparent === true, '复用材质已复位（透明度不带上一只的残值）', `op=${sb.aura && sb.aura.material.opacity}`);
    undressSoldier(sb);
    // 预编译入口：无真实渲染器（stub）时也要安全返回、不抛
    let prewarmThrew = false, prewarmZero = -1;
    try { prewarmZero = prewarmBossFx(undefined, gL.renderer.scene, gL.renderer.camera); } catch (e) { prewarmThrew = true; }
    ok(!prewarmThrew && prewarmZero === 0, 'prewarmBossFx 缺渲染器时优雅降级（返回 0，不抛异常）', `n=${prewarmZero}`);
    // 小怪第一次上场同样要现融轮廓件、现建顶点缓冲、现编译着色器，而那个时机恰好是开局第一波——
    // 所以预编译必须覆盖整个 LOOKS，不能只盯着三种 BOSS。
    // 这里传假渲染器：只验"每种外观都备好了料、且只调一次 compile"（真编译在浏览器里发生）
    let compiledCalls = 0;
    const warmN = prewarmBossFx({ compile: () => { compiledCalls++; } }, gL.renderer.scene, gL.renderer.camera);
    ok(warmN >= 50 && compiledCalls === 1, 'prewarmBossFx 把所有外观件挂进隐藏组且只 compile 一次', `n=${warmN} compile=${compiledCalls}`);
    const cold = [];
    for (const key of Object.keys(LOOKS)) {
      const s2 = new BSoldier('GR');
      dressSoldier(s2, key, false, {});
      if (!s2.matSet || !s2.matSet.prewarmed) cold.push(key);
      undressSoldier(s2);
    }
    ok(cold.length === 0, 'prewarmBossFx 覆盖全部外观种类（小怪首次上场也不现编译）', cold.join(','));
    // 回归：applyRemote 每帧对"已换装远端"跑 LOD/粒子分支——这里曾误用未定义的 g，导致一进 PVE 每帧抛错、渲染循环中断（全客户端卡死）
    const { F } = await import('/src/netsim.js');
    boss.alive = true;                                       // 置活：避免 applyRemote 走 reset() 改动共享的 boss 体型
    L.buf = [{ st: 0, ps: new Map([[9003, [9003, 900, 0, 0, 0, 0, F.alive | F.online | F.ground, 0, 0, 0]]]) }];   // 放在 900m 外：跑 LOD 但不触发粒子（stub fx 无 add/smoke）
    let arErr = null;
    try { L.applyRemote(9003, boss, 0, 0.016); } catch (e) { arErr = e; }
    ok(!arErr, 'applyRemote 对已换装远端不抛错（LOD/粒子分支作用域正确）', arErr && String(arErr && arErr.message || arErr).slice(0, 120));
    ok(boss.soldier.fxRefs && typeof boss.soldier.fxRefs.lod === 'number', 'applyRemote 写入了 LOD 淡出系数');
    boss.soldier.root.position.set(0, 0, 0);                 // 复位，免得影响后续贴合骨骼断言
    let aerr = null;
    try { for (let i = 0; i < 4; i++) boss.soldier.update(0.016, { speed: 4, fwd: 1, crouch: false, pitch: 0.1, onGround: true }); } catch (e) { aerr = e; }
    ok(!aerr && boss.soldier.breathT > 0.05, 'BOSS 带配件的动画可正常推进', aerr ? String(aerr).slice(0, 120) : '');
    const auraAI = boss.soldier.aura.material.color.getHex();
    // 真人附身：同一只 BOSS 换"驾驶员标记"
    L.syncRoster([
      row(1, '我', { team: 'BL' }),
      row(9001, '丧尸3', { kind: 'infected' }),
      row(9002, '重装暴徒', { kind: 'heavy' }),
      row(9003, '张三', { kind: 'tyran', boss: 2, bnm: '铁皮暴君', hp: 1800, hpMax: 2400 }),
    ]);
    ok(boss.soldier.possessed === true && !!boss.soldier.crown && boss.soldier.aura.material.color.getHex() !== auraAI, '玩家附身的 BOSS：头顶旋核 + 光环换色，与 AI 版区分');
    ok(gL.tags.some((t) => t.actor === boss), '附身后的 BOSS 仍带名牌（看得出谁在里面）');
    // 轮廓件必须挂在对应骨骼附近，否则会飘在体外
    const nearBones = (sol) => {
      sol.root.position.set(0, 0, 0); sol.root.rotation.set(0, 0, 0);
      sol.mesh.position.set(0, 0, 0); sol.mesh.updateMatrixWorld(true);
      // 容差跟着体型走：配件的挂载偏移会随巨体等比放大，固定 1 米会误判成飘件
      const lim = 0.55 * (sol.mesh.scale.y || 1) + 0.2;
      const bm = new THREE.Box3();
      let bad = 0;
      for (const m of sol.extras) {
        if (!m.parent || !m.parent.isBone || !m.geometry) continue;
        bm.setFromObject(m);
        if (bm.isEmpty()) continue;
        if (bm.getCenter(new THREE.Vector3()).distanceTo(m.parent.getWorldPosition(new THREE.Vector3())) > lim) bad++;
      }
      return bad;
    };
    const bossDrift = nearBones(boss.soldier), heavyDrift = nearBones(hv.soldier);
    ok(bossDrift === 0, 'BOSS 轮廓件全部贴合骨骼（无飘件）', `drift=${bossDrift}`);
    ok(heavyDrift === 0, '重装暴徒轮廓件贴合骨骼', `drift=${heavyDrift}`);
    // 光效：本体光源 + 光晕 + 天光柱，大体型靠它们在全图定位
    const R = boss.soldier.fxRefs;
    ok(R && R.halo && R.beam && R.light, 'BOSS 自带光晕 / 天光柱 / 动态点光源');
    ok(R.light.o.isPointLight === true && R.light.i > 20 && R.light.o.distance > 10, 'BOSS 点光源会照亮周围甲板', `i=${R.light && R.light.i}`);

  const sawRejoin = await new Promise((res) => {
    const old = B.onEvent.bind(B);
    let got = false;
    B.onEvent = (e) => { if (e.e === 'rejoin') got = true; old(e); };
    setTimeout(() => { B.onEvent = old; res(got); }, 1500);
  });
  ok(sawRejoin || B.remotes.size === 1, 'B 感知 A 重连（事件或席位保持）');

  // ---------- 退出 ----------
  {
    const oldSnap = B.onSnap.bind(B);
    const seen = [];
    B.onSnap = (m) => { if (m.ev) for (const e of m.ev) seen.push(e.e + (e.id !== undefined ? ':' + e.id : '')); if (m.roster) seen.push('roster:' + m.roster.length); oldSnap(m); };
    A.leave();
    for (let i = 0; i < 60 && B.remotes.size > 0; i++) await sleep(100);
    say('DEBUG B 收到: ' + [...new Set(seen)].slice(-12).join(' '));
    say('DEBUG B.remotes=' + B.remotes.size + ' B.inMatch=' + B.inMatch + ' A.inMatch=' + A.inMatch);
    ok(!A.inMatch && B.remotes.size === 0, '离开后房间名册同步');
  }

  C.leave();
  B.leave();
  drv.forEach(clearInterval);
} catch (e) {
  say('FATAL ' + (e && e.stack || e)); F++;
}
say(`RESULT ${P} ${F}`);
document.title = 'NETDONE';
</script>
