<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D 资产工作台 · 穿越火线运输船</title>
<script type="importmap">{"imports":{"three":"/vendor/three.module.js","three/addons/":"/addons/"}}</script>
<style>
  :root {
    --bg: #0c0f14; --panel: #141922; --panel2: #1a2130; --line: #232c3b; --line2: #30405a;
    --fg: #d7dde7; --dim: #8b97a8; --acc: #f5b321; --ok: #3fb37f; --warn: #e08b3a; --bad: #e0574a;
    --p0: #ff6b57; --p1: #f5b321; --p2: #58a6ff; --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.55 "Microsoft YaHei", system-ui, sans-serif; overflow: hidden; }
  header { display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 14px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header .ttl { font-size: 14px; } header .ttl b { color: var(--acc); }
  .sp { flex: 1; }
  .pill { font: 11px/1 var(--mono); color: var(--dim); border: 1px solid var(--line); border-radius: 999px; padding: 6px 10px; white-space: nowrap; }
  .bar { width: 150px; height: 6px; border-radius: 3px; background: #222c3a; overflow: hidden; display: inline-block; vertical-align: 2px; }
  .bar i { display: block; height: 100%; background: linear-gradient(90deg, #2c7f5c, var(--ok)); }
  button, select, input[type=text] { font: 12px/1 inherit; color: var(--fg); background: #20293a; border: 1px solid var(--line2); border-radius: 5px; padding: 7px 10px; cursor: pointer; white-space: nowrap; }
  input[type=text] { cursor: text; }
  button:hover { background: #2b3648; border-color: #46566f; }
  button.on { background: var(--acc); border-color: var(--acc); color: #10141b; font-weight: 700; }
  button.pri { background: #23324a; border-color: #3b557a; }
  layout, .wrap { display: grid; grid-template-columns: 320px minmax(0, 1fr) 460px; height: calc(100% - 46px); }
  @media (max-width: 1500px) { .wrap { grid-template-columns: 290px minmax(0, 1fr) 400px; } }
  aside, main, .view { min-height: 0; overflow: auto; }
  aside { background: var(--panel); border-right: 1px solid var(--line); }
  .filters { padding: 10px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); z-index: 3; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
  .chip { font: 11px/1 var(--mono); padding: 5px 7px; border-radius: 4px; border: 1px solid var(--line2); color: var(--dim); cursor: pointer; background: #171d28; }
  .chip.on { color: #10141b; font-weight: 700; border-color: transparent; }
  .chip.p0.on { background: var(--p0); } .chip.p1.on { background: var(--p1); } .chip.p2.on { background: var(--p2); }
  .chip.st.on { background: var(--ok); }
  .item { display: flex; gap: 8px; align-items: flex-start; padding: 9px 11px; border-bottom: 1px solid #1a212c; cursor: pointer; }
  .item:hover { background: #19212e; }
  .item.sel { background: #1d283a; box-shadow: inset 3px 0 0 var(--acc); }
  .item .dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; flex: none; background: #3a465a; }
  .item .dot.todo { background: #3a465a; } .item .dot.ready { background: var(--warn); box-shadow: 0 0 6px var(--warn); }
  .item .dot.pass { background: var(--ok); box-shadow: 0 0 6px var(--ok); } .item .dot.reject { background: var(--bad); box-shadow: 0 0 6px var(--bad); }
  .item .nm { font-weight: 600; }
  .item .sub { color: var(--dim); font: 11px/1.4 var(--mono); }
  .pr { font: 10px/1 var(--mono); padding: 3px 5px; border-radius: 3px; flex: none; margin-top: 4px; }
  .pr.P0 { background: rgba(255,107,87,.16); color: var(--p0); } .pr.P1 { background: rgba(245,179,33,.14); color: var(--p1); } .pr.P2 { background: rgba(88,166,255,.14); color: var(--p2); }
  main { padding: 14px 18px 40px; }
  h1 { font-size: 17px; margin: 0 0 2px; } h2 { font-size: 13px; margin: 20px 0 7px; color: var(--acc); letter-spacing: .4px; }
  .meta { color: var(--dim); font: 11px var(--mono); }
  .spec { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; margin-top: 10px; }
  .spec div { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
  .spec b { display: block; color: var(--dim); font-size: 11px; font-weight: 500; margin-bottom: 3px; }
  .spec span { font: 12px var(--mono); word-break: break-word; }
  .spec select { max-width: 190px; margin-right: 6px; }
  .spec .ok { color: var(--ok); } .spec .bad { color: var(--bad); }
  .prompt { background: #10161f; border: 1px solid var(--line2); border-radius: 7px; padding: 11px 12px; font: 12px/1.7 var(--mono); white-space: pre-wrap; word-break: break-word; position: relative; }
  .prompt + .prompt { margin-top: 8px; }
  .copy { position: absolute; top: 8px; right: 8px; padding: 4px 7px; font-size: 11px; }
  ul.tips { margin: 6px 0 0; padding-left: 18px; color: #b6c0cf; }
  ul.tips li { margin: 3px 0; }
  .flow { margin: 12px 0; padding: 6px 9px; border: 1px solid var(--line2); border-radius: 6px; background: var(--panel2); }
  .flow summary { cursor: pointer; color: var(--dim); font-size: 12px; }
  .flow[open] summary { color: var(--fg); }
  .chk { display: flex; gap: 8px; align-items: flex-start; padding: 6px 8px; border-bottom: 1px solid #1a212c; }
  .chk input { margin-top: 3px; }
  .chk .why { color: var(--dim); font-size: 11px; }
  .chk.auto-pass { background: rgba(63,179,127,.07); } .chk.auto-warn { background: rgba(224,170,74,.09); }
  .chk.auto-fail { background: rgba(224,87,74,.09); }
  .tagline { display: inline-block; font: 10px/1 var(--mono); padding: 4px 6px; border-radius: 4px; margin: 0 4px 4px 0; border: 1px solid var(--line2); color: var(--dim); }
  .tagline.ok { color: var(--ok); border-color: #2c5c46; } .tagline.bad { color: var(--bad); border-color: #6b3230; }
  .tagline.warn { color: #e0aa4a; border-color: #6b5326; }
  .drop { border: 1.5px dashed var(--line2); border-radius: 8px; padding: 16px; text-align: center; color: var(--dim); background: #10161f; }
  .drop.hot { border-color: var(--acc); color: var(--acc); background: #17202c; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
  textarea { width: 100%; min-height: 62px; background: #10161f; color: var(--fg); border: 1px solid var(--line2); border-radius: 6px; padding: 9px 10px; font: 12px/1.6 inherit; resize: vertical; }
  .view { background: #05070b; border-left: 1px solid var(--line); display: flex; flex-direction: column; }
  #stage { position: relative; flex: 1; min-height: 260px; }
  #stage canvas { display: block; width: 100%; height: 100%; }
  .vtb { display: flex; gap: 6px; flex-wrap: wrap; padding: 8px 10px; border-bottom: 1px solid var(--line); background: var(--panel); }
  .vtb select { max-width: 190px; }
  .hud { position: absolute; left: 10px; bottom: 10px; right: 10px; background: rgba(10,13,19,.82); border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; font: 11px/1.6 var(--mono); backdrop-filter: blur(3px); }
  .hud .k { color: var(--dim); }
  #empty { padding: 40px 20px; color: var(--dim); text-align: center; }
  .note { color: var(--dim); font-size: 12px; margin-top: 8px; }
  #toast { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 7px; z-index: 20; }
  #toast div { background: #1f2836; border: 1px solid var(--line2); border-left: 3px solid var(--ok); border-radius: 6px; padding: 9px 13px; max-width: 400px; box-shadow: 0 8px 24px rgba(0,0,0,.5); }
  #toast div.err { border-left-color: var(--bad); }
  ::-webkit-scrollbar { width: 10px; height: 10px; } ::-webkit-scrollbar-thumb { background: #2a3446; border-radius: 5px; } ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>
<header>
  <div class="ttl">穿越火线 · 运输船 <b>3D 资产工作台</b></div>
  <span class="pill" id="prog">进度 —</span>
  <span class="bar"><i id="progBar" style="width:0%"></i></span>
  <div class="sp"></div>
  <span class="pill" id="dbInfo">本地库 —</span>
  <button id="btnExport">导出验收单 JSON</button>
  <button id="btnImport">导入</button>
  <button id="btnReload" title="重新读取 tools/asset-manifest.js">刷新清单</button>
</header>

<div class="wrap">
  <aside>
    <div class="filters">
      <div class="chips" id="prChips"></div>
      <div class="chips" id="catChips"></div>
      <div class="chips" id="stChips"></div>
      <input type="text" id="q" placeholder="搜索名称 / 提示词关键字" style="width:100%">
    </div>
    <div id="list"></div>
  </aside>

  <main id="detail"><div id="empty">左侧选一个资产条目</div></main>

  <section class="view">
    <div class="vtb">
      <button id="btnFile">载入 GLB…</button>
      <select id="clips" title="动画片段"><option value="">（无动画）</option></select>
      <button id="btnPlay" class="on">播放</button>
      <select id="speed"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select>
      <button id="btnWire">线框</button>
      <button id="btnGrid" class="on">网格</button>
      <button id="btnBone">骨骼</button>
      <button id="btnRef" class="on">人形 1.8m</button>
      <button id="btnSpin">自转</button>
      <button id="btnFit">复位</button>
    </div>
    <div id="stage">
      <div class="hud" id="hud"><span class="k">等待 GLB…　</span>把 Tripo 导出的 .glb 拖到这里，或点「载入 GLB」。也可以直接拖到窗口任意位置。</div>
    </div>
  </section>
</div>
<div id="toast"></div>
<input type="file" id="file" accept=".glb,.gltf" style="display:none">
<input type="file" id="jsonFile" accept=".json" style="display:none">

<script type="module" src="./assetlab.js"></script>
</body>
</html>
